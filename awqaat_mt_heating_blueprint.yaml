blueprint:
  name: Awqaat MT - Heating
  description: 'Switches your heating on and off at times based on the prayer times. Example: on 2 hours before
    Fajr, off at Sunrise. You can set up to 10 heating times, each with its own days. It can also switch off when
    the room is warm enough, keep the room above a minimum, protect against frost, skip warm days, and let you take
    control from a dashboard (Auto / On / Off). If someone switches the heating on or off by hand, the automation
    leaves it alone until the next heating time.'
  domain: automation
  input:
    devices_section:
      name: 1. What to heat
      icon: mdi:radiator
      collapsed: false
      description: Choose the switches or heating devices this automation controls.
      input:
        devices:
          name: Heating devices
          description: Pick everything that should switch on and off together, for example your heating relay or
            switch. If someone switches one of these on or off by hand, the automation notices and leaves it alone
            until the next heating time.
          selector:
            entity:
              multiple: true
    helpers_section:
      name: 2. Helpers (create these first)
      icon: mdi:cog
      collapsed: false
      description: The automation needs 4 small helpers so it can remember things. Create each one in Settings >
        Devices & services > Helpers > Create helper, then pick it below. Only the dropdown and the minutes are
        for you to use. Put those two on your dashboard.
      input:
        until_entity:
          name: 'Helper 1: when the heating should finish'
          description: Create a Date and/or time helper and tick both Date and Time. The automation uses it to remember
            when the current heating time ends.
          selector:
            entity:
              filter:
              - domain: input_datetime
        expected_entity:
          name: 'Helper 2: is the heating meant to be on?'
          description: Create a Toggle helper. The automation uses it to remember what it last told the heating
            to do, so it can tell when someone changes it by hand.
          selector:
            entity:
              filter:
              - domain: input_boolean
        override_mode_entity:
          name: 'Helper 3: manual control dropdown'
          description: 'Create a Dropdown helper with exactly these 4 options, in this order: Auto, On, Off, Hold.
            Auto = follow the schedule. On = keep the heating on. Off = keep the heating off. Hold = the automation
            has stepped back (it sets this itself when someone switches the heating by hand).'
          selector:
            entity:
              filter:
              - domain: input_select
        override_minutes_entity:
          name: 'Helper 4: how long On or Off lasts (minutes)'
          description: Create a Number helper (minimum 0, maximum 1440, step 5). Set the minutes first, then choose
            On or Off in the dropdown. After that many minutes it goes back to Auto. 0 means it stays until you
            change it back.
          selector:
            entity:
              filter:
              - domain: input_number
        pause_timer_entity:
          name: Pause timer (optional)
          description: Create a Timer helper if you want a pause button. While the timer is running the automation
            does nothing, so you can use the heating by hand. When the timer finishes, the automation carries on.
          default: null
          selector:
            entity:
              filter:
              - domain: timer
        status_entity:
          name: Status line (optional)
          description: 'Create a Text helper and set its maximum length to 255. The automation writes a short sentence
            here saying why the heating is on or off, for example ''Off: room is warm enough''. Show it on your
            dashboard.'
          default: null
          selector:
            entity:
              filter:
              - domain: input_text
    temps_section:
      name: 3. Room temperature (optional)
      icon: mdi:thermometer
      collapsed: true
      description: Tick a box to switch a feature on. Anything left unticked does nothing.
      input:
        thermostats:
          name: Room temperature sensors
          description: Pick one or more temperature sensors (or heating thermostats). Heating starts when the coldest
            room is too cold and stops once the warmest room reaches the target. Sensors that are unavailable are
            ignored.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                - climate
        use_temp_control:
          name: Switch off when the room is warm enough
          description: Tick this to use the target temperature below. The heating switches off when the room reaches
            the target, and back on if the room cools down. If you leave this unticked, the heating just runs for
            the whole heating time, whatever the room temperature is.
          default: false
          selector:
            boolean: {}
        on_temp:
          name: Target temperature
          description: The room temperature you want. Only used if the box above is ticked.
          default: 21
          selector:
            number:
              min: 5
              max: 30
              mode: box
              step: 0.5
              unit_of_measurement: °C
        use_hold_temp:
          name: Keep the room above a minimum, even outside heating times
          description: Tick this to stop the room getting too cold between heating times. If it drops below the
            minimum temperature below, the heating comes on until the room is back up to it.
          default: false
          selector:
            boolean: {}
        hold_temp:
          name: Minimum temperature
          description: Only used if the box above is ticked.
          default: 16
          selector:
            number:
              min: 5
              max: 30
              mode: box
              step: 0.5
              unit_of_measurement: °C
        temp_margin:
          name: Gap before switching back on
          description: 'Stops the heating switching on and off all the time. After it switches off, it waits until
            the room is this much below the target before switching on again. Example: target 21 and gap 0.5 means
            it comes back on below 20.5.'
          default: 0.5
          selector:
            number:
              min: 0
              max: 3
              mode: box
              step: 0.1
              unit_of_measurement: °C
        use_frost:
          name: Frost protection
          description: Tick this to make the heating come on if a room gets very cold, whatever else is set.
          default: false
          selector:
            boolean: {}
        frost_temp:
          name: Frost temperature
          description: The heating comes on if the coldest room drops below this.
          default: 5
          selector:
            number:
              min: 0
              max: 15
              mode: box
              step: 0.5
              unit_of_measurement: °C
        override_beats_frost:
          name: Let 'Off' stop frost protection
          description: Normally frost protection still switches the heating on even if the dropdown is set to Off.
            Tick this if you want Off to really mean off.
          default: false
          selector:
            boolean: {}
        use_outside:
          name: Don't start heating when it's warm outside
          description: Tick this to stop the heating starting on mild days. It uses the outside temperature and
            limit below.
          default: false
          selector:
            boolean: {}
        outside_entity:
          name: Outside temperature
          description: Pick an outdoor temperature sensor, or a weather service such as weather.home (it uses the
            current temperature).
          default: null
          selector:
            entity:
              filter:
              - domain:
                - sensor
                - weather
        outside_max:
          name: Outside temperature limit
          description: The heating won't start if it's warmer than this outside. If it's already running, it carries
            on. Frost protection still works.
          default: 15
          selector:
            number:
              min: 0
              max: 40
              mode: box
              step: 0.5
              unit_of_measurement: °C
        use_forecast:
          name: Skip heating on days forecast to be warm
          description: Tick this to check the weather forecast just before the heating would start. If today's forecast
            high is at or above the limit below, the heating doesn't start and the dropdown shows Hold until the
            next heating time. It never stops heating that is already running.
          default: false
          selector:
            boolean: {}
        forecast_entity:
          name: Weather service for the forecast
          description: Pick your weather service, for example weather.home. It must provide a daily forecast.
          default: null
          selector:
            entity:
              filter:
              - domain: weather
        forecast_max:
          name: Forecast limit
          description: Heating is skipped for the day if the forecast high is this or higher.
          default: 20
          selector:
            number:
              min: 0
              max: 40
              mode: box
              step: 0.5
              unit_of_measurement: °C
    safety_section:
      name: 4. Safety and alerts (optional)
      icon: mdi:shield-check
      collapsed: true
      description: Tick a box to switch a feature on. Anything left unticked does nothing.
      input:
        use_max_run:
          name: Switch off if the heating has been on too long (recommended)
          description: A safety net. If the heating has been on for longer than the time below without a break,
            it is switched off and stays off until the next heating time. It also catches heating that someone switched
            on by hand and forgot.
          default: true
          selector:
            boolean: {}
        max_run_hours:
          name: Longest it can stay on (hours)
          description: Only used if the box above is ticked.
          default: 10
          selector:
            number:
              min: 1
              max: 48
              mode: box
              step: 0.5
              unit_of_measurement: h
        use_min_times:
          name: Avoid switching on and off too quickly
          description: Tick this to stop the boiler clicking on and off. Once the heating switches on (or off) it
            stays that way for at least the times below. This does not apply to the dropdown or frost protection.
          default: false
          selector:
            boolean: {}
        min_run_minutes:
          name: Stay on for at least (minutes)
          description: Only used if the box above is ticked.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              mode: box
              unit_of_measurement: min
        min_rest_minutes:
          name: Stay off for at least (minutes)
          description: Only used if the box above is ticked.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              mode: box
              unit_of_measurement: min
        use_alert:
          name: Alert me when a room sensor stops working
          description: Tick this to run the alert below once an hour while a sensor has been unavailable for 10
            minutes or more.
          default: false
          selector:
            boolean: {}
        alert_action:
          name: What to do for the alert
          description: For example, send a phone notification. Type {{ alert_message }} in the message to include
            the names of the sensors that stopped working.
          default: []
          selector:
            action: {}
    slot_1_section:
      name: Heating time 1
      icon: mdi:clock-outline
      collapsed: true
      description: 'One time to switch the heating on and one time to switch it off. You need both, otherwise this
        heating time does nothing. Leave ''Switch ON'' empty to skip it. Example: on 2 hours before Fajr and off
        at Sunrise. Switch ON: Fajr, Before, 120. Switch OFF: Sunrise, After, 0.'
      input:
        slot_1_days:
          name: Days it runs
          description: Tick the days it should start on. If it runs past midnight, it still finishes the next day.
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - value: mon
                label: Monday
              - value: tue
                label: Tuesday
              - value: wed
                label: Wednesday
              - value: thu
                label: Thursday
              - value: fri
                label: Friday
              - value: sat
                label: Saturday
              - value: sun
                label: Sunday
        slot_1_on_entity:
          name: 'Switch ON: which time?'
          description: Pick a time sensor, for example Fajr Salaah.
          default: null
          selector:
            entity:
              filter:
              - domain: sensor
                device_class: timestamp
        slot_1_on_dir:
          name: 'Switch ON: before or after that time?'
          default: before
          selector:
            select:
              options:
              - value: before
                label: Before
              - value: after
                label: After
        slot_1_on_min:
          name: 'Switch ON: how many minutes?'
          description: For example 120 = 2 hours. Use 0 to switch on exactly at that time.
          default: 0
          selector:
            number:
              min: 0
              max: 1440
              mode: box
              unit_of_measurement: min
        slot_1_off_entity:
          name: 'Switch OFF: which time?'
          description: Pick a time sensor that comes after the ON time, for example Sunrise.
          default: null
          selector:
            entity:
              filter:
              - domain: sensor
                device_class: timestamp
        slot_1_off_dir:
          name: 'Switch OFF: before or after that time?'
          default: after
          selector:
            select:
              options:
              - value: before
                label: Before
              - value: after
                label: After
        slot_1_off_min:
