blueprint:
  name: Awqaat MT - Heating (schedule slots, temperature, override)
  description: Heating controller driven by Awqaat MT time sensors. Up to 10 slots, each with its own days, an ON
    time and an OFF time (minutes before or after any sensor). Optional temperature control, hold temperature, frost
    protection, outside-temperature block, max run, min run/rest, unavailable alert, pause timer, and a dashboard
    override (Auto / On / Off with an optional time limit). Windows that cross midnight work. Manual changes to
    the heating devices are noticed and respected until the next scheduled event.
  domain: automation
  input:
    devices_section:
      name: 1. Devices
      icon: mdi:radiator
      collapsed: false
      description: What the heating controls.
      input:
        devices:
          name: Heating devices
          description: Everything to switch on and off together (switches, climate entities, relays...). Also used
            to notice when someone changes them by hand.
          selector:
            entity:
              multiple: true
    helpers_section:
      name: 2. Helpers (create these first)
      icon: mdi:cog
      collapsed: false
      description: Settings > Devices & services > Helpers. Exact settings are in the setup notes.
      input:
        until_entity:
          name: Heating-until helper
          description: Date and time helper. Remembers when the current scheduled heating window ends, so windows
            survive midnight and restarts.
          selector:
            entity:
              filter:
              - domain: input_datetime
        expected_entity:
          name: Heating-expected-on helper
          description: Toggle helper. Remembers what this automation last told the heating to do.
          selector:
            entity:
              filter:
              - domain: input_boolean
        override_mode_entity:
          name: Override dropdown helper
          description: 'Dropdown helper with options exactly: Auto, On, Off, Hold (Auto first). Put it on your dashboard.'
          selector:
            entity:
              filter:
              - domain: input_select
        override_minutes_entity:
          name: Override minutes helper
          description: Number helper. Minutes an On/Off override lasts, then back to Auto. 0 = until you change
            it. Set this first, then pick On or Off.
          selector:
            entity:
              filter:
              - domain: input_number
        pause_timer_entity:
          name: Pause timer (optional)
          description: While this timer is running the automation sends no commands (it keeps tracking, so it catches
            up when the timer ends).
          default: null
          selector:
            entity:
              filter:
              - domain: timer
    temps_section:
      name: 3. Temperature control (all optional)
      icon: mdi:thermometer
      collapsed: true
      description: Tick a box to switch a feature on. Anything unticked is ignored.
      input:
        thermostats:
          name: Thermostats / temperature sensors
          description: Any number. The lowest reading decides when heat is needed and the highest reading stops
            it, so the warmest room caps the heating. Climate entities use their current temperature.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                - climate
        use_temp_control:
          name: Follow temperature during a scheduled window
          description: 'On: heat up to the ON temperature, then pause. Off: just on/off by schedule.'
          default: false
          selector:
            boolean: {}
        on_temp:
          name: ON temperature
          description: Target while a scheduled window is active.
          default: 21
          selector:
            number:
              min: 5
              max: 30
              mode: box
              step: 0.5
              unit_of_measurement: °C
        use_hold_temp:
          name: Hold a minimum temperature outside windows
          description: Come back on if the lowest reading falls below the OFF temperature.
          default: false
          selector:
            boolean: {}
        hold_temp:
          name: OFF (hold) temperature
          default: 16
          selector:
            number:
              min: 5
              max: 30
              mode: box
              step: 0.5
              unit_of_measurement: °C
        temp_margin:
          name: Temperature margin
          description: Stops rapid switching. After heating stops it will not restart until the warmest reading
            is this far below the target.
          default: 0.5
          selector:
            number:
              min: 0
              max: 3
              mode: box
              step: 0.1
              unit_of_measurement: °C
        use_frost:
          name: Frost protection
          description: Turn on if the lowest reading falls below the frost temperature, whatever else is set.
          default: false
          selector:
            boolean: {}
        frost_temp:
          name: Frost temperature
          default: 5
          selector:
            number:
              min: 0
              max: 15
              mode: box
              step: 0.5
              unit_of_measurement: °C
        override_beats_frost:
          name: Forced OFF override beats frost protection
          default: false
          selector:
            boolean: {}
        use_outside:
          name: Do not heat when it is warm outside
          default: false
          selector:
            boolean: {}
        outside_entity:
          name: Outside temperature (sensor or weather entity)
          description: A temperature sensor, or a weather entity such as weather.home (its current temperature is
            used).
          default: null
          selector:
            entity:
              filter:
              - domain:
                - sensor
                - weather
        outside_max:
          name: Outside temperature limit
          description: Heating will not START while outside is above this. A session already running carries on.
            Frost protection is not affected.
          default: 15
          selector:
            number:
              min: 0
              max: 40
              mode: box
              step: 0.5
              unit_of_measurement: °C
        use_forecast:
          name: Skip heating when the day's forecast is warm
          description: Checks the weather forecast when heating is about to start. If the forecast HIGH for that
            day is at or above the limit below, heating does not start and the dropdown shows Hold until the next
            scheduled event. Never interrupts a running session. Frost protection and overrides still work.
          default: false
          selector:
            boolean: {}
        forecast_entity:
          name: Weather entity for the forecast
          description: A weather entity that provides a daily forecast, e.g. weather.home.
          default: null
          selector:
            entity:
              filter:
              - domain: weather
        forecast_max:
          name: Forecast high limit
          description: Heating is skipped for the day if the forecast high is at or above this.
          default: 20
          selector:
            number:
              min: 0
              max: 40
              mode: box
              step: 0.5
              unit_of_measurement: °C
    safety_section:
      name: 4. Limits and alerts (all optional)
      icon: mdi:shield-check
      collapsed: true
      input:
        use_max_run:
          name: Maximum run time (strongly advised)
          description: Forces the heating off if it has been on this long without a break, then holds until the
            next scheduled event. Also covers a heater someone switched on by hand and forgot.
          default: true
          selector:
            boolean: {}
        max_run_hours:
          name: Maximum run time (hours)
          default: 10
          selector:
            number:
              min: 1
              max: 48
              mode: box
              step: 0.5
              unit_of_measurement: h
        use_min_times:
          name: Minimum run and rest time
          description: Stops the boiler switching on and off rapidly. Does not apply to overrides or frost protection.
          default: false
          selector:
            boolean: {}
        min_run_minutes:
          name: Minimum run time (minutes)
          default: 10
          selector:
            number:
              min: 0
              max: 120
              mode: box
              unit_of_measurement: min
        min_rest_minutes:
          name: Minimum rest time (minutes)
          default: 10
          selector:
            number:
              min: 0
              max: 120
              mode: box
              unit_of_measurement: min
        use_alert:
          name: Alert when thermostats are unavailable
          description: Runs the alert action once an hour while a thermostat has been unavailable for 10 minutes
            or more.
          default: false
          selector:
            boolean: {}
        alert_action:
          name: Alert action
          description: e.g. a phone notification. Use {{ alert_message }} as the message text.
          default: []
          selector:
            action: {}
    slot_1_section:
      name: Slot 1
      icon: mdi:clock-outline
      collapsed: true
      description: A slot needs both an ON sensor and an OFF sensor to run. Leave the ON sensor empty to ignore
        the slot. OFF must come after ON.
      input:
        slot_1_days:
          name: Days this slot runs
          description: The day the ON time falls on.
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - value: mon
                label: Monday
              - value: tue
                label: Tuesday
              - value: wed
                label: Wednesday
              - value: thu
                label: Thursday
              - value: fri
                label: Friday
              - value: sat
                label: Saturday
              - value: sun
                label: Sunday
        slot_1_on_entity:
          name: ON - time sensor
          default: null
          selector:
            entity:
              filter:
              - domain: sensor
                device_class: timestamp
        slot_1_on_dir:
          name: ON - before or after
          default: before
          selector:
            select:
              options:
              - value: before
                label: Before
              - value: after
                label: After
        slot_1_on_min:
          name: ON - minutes
          description: 120 = 2 hours.
          default: 0
          selector:
            number:
              min: 0
              max: 1440
              mode: box
              unit_of_measurement: min
        slot_1_off_entity:
          name: OFF - time sensor
          description: Any sensor. e.g. Fajr slot can turn off at Sunrise.
          default: null
          selector:
            entity:
              filter:
              - domain: sensor
                device_class: timestamp
        slot_1_off_dir:
          name: OFF - before or after
          default: after
          selector:
            select:
              options:
