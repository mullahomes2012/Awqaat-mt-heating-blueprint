mode: queued
max: 5
max_exceeded: silent
trigger:
- platform: time_pattern
  id: tick
  minutes: /1
- platform: state
  id: override_change
  entity_id: !input 'override_mode_entity'
- platform: homeassistant
  id: ha_start
  event: start
variables:
  slots:
  - days: !input 'slot_1_days'
    on_entity: !input 'slot_1_on_entity'
    on_dir: !input 'slot_1_on_dir'
    on_min: !input 'slot_1_on_min'
    off_entity: !input 'slot_1_off_entity'
    off_dir: !input 'slot_1_off_dir'
    off_min: !input 'slot_1_off_min'
  - days: !input 'slot_2_days'
    on_entity: !input 'slot_2_on_entity'
    on_dir: !input 'slot_2_on_dir'
    on_min: !input 'slot_2_on_min'
    off_entity: !input 'slot_2_off_entity'
    off_dir: !input 'slot_2_off_dir'
    off_min: !input 'slot_2_off_min'
  - days: !input 'slot_3_days'
    on_entity: !input 'slot_3_on_entity'
    on_dir: !input 'slot_3_on_dir'
    on_min: !input 'slot_3_on_min'
    off_entity: !input 'slot_3_off_entity'
    off_dir: !input 'slot_3_off_dir'
    off_min: !input 'slot_3_off_min'
  - days: !input 'slot_4_days'
    on_entity: !input 'slot_4_on_entity'
    on_dir: !input 'slot_4_on_dir'
    on_min: !input 'slot_4_on_min'
    off_entity: !input 'slot_4_off_entity'
    off_dir: !input 'slot_4_off_dir'
    off_min: !input 'slot_4_off_min'
  - days: !input 'slot_5_days'
    on_entity: !input 'slot_5_on_entity'
    on_dir: !input 'slot_5_on_dir'
    on_min: !input 'slot_5_on_min'
    off_entity: !input 'slot_5_off_entity'
    off_dir: !input 'slot_5_off_dir'
    off_min: !input 'slot_5_off_min'
  - days: !input 'slot_6_days'
    on_entity: !input 'slot_6_on_entity'
    on_dir: !input 'slot_6_on_dir'
    on_min: !input 'slot_6_on_min'
    off_entity: !input 'slot_6_off_entity'
    off_dir: !input 'slot_6_off_dir'
    off_min: !input 'slot_6_off_min'
  - days: !input 'slot_7_days'
    on_entity: !input 'slot_7_on_entity'
    on_dir: !input 'slot_7_on_dir'
    on_min: !input 'slot_7_on_min'
